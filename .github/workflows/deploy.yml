name: Deploy to Cloudflare Workers

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/ensure-kv.sh'
      - 'package.json'
      - 'package-lock.json'
      - 'wrangler.toml'
      - '.github/workflows/deploy.yml'

concurrency:
  group: deploy-workers
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Type check
        run: npm run type-check

      # Resolves (or creates) the KV namespace and writes its id into
      # wrangler.toml. The committed file only holds a placeholder, so this has
      # to run before deploy.
      - name: Ensure KV namespace
        run: ./scripts/ensure-kv.sh

      - name: Deploy
        id: deploy
        run: |
          # Without pipefail the exit status would be tee's, hiding a failed deploy.
          set -o pipefail
          npx wrangler deploy 2>&1 | tee deploy.log
          url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -n1)
          if [[ -z "$url" ]]; then
            echo "deploy produced no workers.dev URL" >&2
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Smoke test
        if: steps.deploy.outputs.url != ''
        run: ./scripts/smoke-test.sh "${{ steps.deploy.outputs.url }}"

      - name: Summary
        if: always()
        run: |
          {
            echo "## Deployment"
            echo
            if [[ -n "${{ steps.deploy.outputs.url }}" ]]; then
              echo "Worker URL: ${{ steps.deploy.outputs.url }}"
              echo
              echo "Claude アプリのカスタムコネクタに登録する URL:"
              echo
              echo '```'
              echo "${{ steps.deploy.outputs.url }}/mcp"
              echo '```'
            else
              echo "デプロイ URL を取得できませんでした。上のログを確認してください。"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
